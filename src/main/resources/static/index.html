<!DOCTYPE html>
<html lang="nn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot">
    <button id="bootBtn" class="boot-btn">
        <span class="boot-ring"></span>
        <span class="boot-label">Aktiver JARVIS</span>
    </button>
    <p class="boot-hint">Klikk for å slå på lyd og mikrofon</p>
</div>

<div class="hud">
    <header class="topbar">
        <div class="brand">J.A.R.V.I.S.<span class="brand-sub">Just A Rather Very Intelligent System</span></div>
        <div class="state-chip" id="stateChip">KVILER</div>
        <div class="clock" id="clock">--:--:--</div>
    </header>

    <aside class="panel telemetry">
        <h2>Telemetri</h2>
        <dl>
            <dt>Stemme</dt><dd id="tVoice">-</dd>
            <dt>Lytting</dt><dd id="tListen">-</dd>
            <dt>Hjerne</dt><dd>Google Gemini</dd>
            <dt>Oppetid</dt><dd id="tUptime">-</dd>
            <dt>Oppgåver</dt><dd id="tTasks">-</dd>
        </dl>
        <h2>Kommandoar</h2>
        <ul class="commands">
            <li><code>/ny</code> ny samtale</li>
            <li><code>/stille</code> slå av opplesing</li>
            <li><code>Esc</code> avbryt</li>
            <li><code>/</code> fokus på feltet</li>
        </ul>
        <h2>Nivå</h2>
        <div class="meter"><div class="meter-fill" id="meterFill"></div><div class="meter-threshold" id="meterThreshold"></div></div>
    </aside>

    <main class="core-area">
        <div class="reactor" id="reactor">
            <canvas id="reactorCanvas" width="420" height="420"></canvas>
        </div>
        <div class="transcript" id="transcript"></div>
        <form class="askbar" id="askForm" autocomplete="off">
            <input type="text" id="taskInput" placeholder="Spør JARVIS om noko, eller snakk til han ..." />
            <button type="button" id="micBtn" class="icon-btn" title="Hald inne / klikk for å snakke">MIC</button>
            <button type="button" id="liveBtn" class="icon-btn" title="Handfri samtale">LIVE</button>
            <button type="submit" id="sendTaskBtn">SEND</button>
        </form>
    </main>

    <aside class="panel actionlog">
        <h2>Handlingslogg</h2>
        <div id="taskList" class="task-list"></div>
    </aside>
</div>

<script src="app.js"></script>
</body>
</html>
