<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Manager Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>AI Manager</h1>
    </header>

    <section class="task-input">
        <h2>Send ny oppgåve</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Skriv kva du vil Manager ska gjer" />
            <button id="sendTaskBtn">Send til Manager</button>
        </div>
        <div id="loadingIndicator" class="hidden">Orkestrerer oppgåva...</div>
    </section>

    <section class="dashboard">
        <h2>Aktive og fullførte oppgåver</h2>
        <div id="taskList" class="task-list">
            <!-- Data blir henta og lasta inn her av app.js -->
        </div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
