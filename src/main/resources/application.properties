# API-nøkkelen blir henta frå miljøvariabelen GEMINI_API_KEY (eller GOOGLE_API_KEY).
# Ikkje skriv nøkkelen direkte inn her - fila ligg i git.
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.model=gemini-3.8-flash
# Blir brukt når hovudmodellen svarar 503 (høg pågang).
gemini.fallback-model=gemini-3.5-flash

# Google Kalender. credentials.json og tokens/ ligg i .gitignore.
google.calendar.credentials-path=credentials.json
google.calendar.tokens-dir=tokens
google.calendar.id=primary
google.calendar.timezone=Europe/Oslo

# ElevenLabs-stemme. Nøkkelen ligg i .env (i .gitignore), som Spring les inn her.
spring.config.import=optional:file:.env[.properties]
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}
elevenlabs.model=${ELEVENLABS_MODEL:eleven_flash_v2_5}
elevenlabs.stt-model=scribe_v1
# Språket du snakkar (ISO 639-3). Tomt = gjett automatisk.
elevenlabs.stt-language=${ELEVENLABS_STT_LANGUAGE:nor}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=update
