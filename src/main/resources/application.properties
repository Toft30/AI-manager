# API-nøkkelen blir henta frå miljøvariabelen GEMINI_API_KEY (eller GOOGLE_API_KEY).
# Ikkje skriv nøkkelen direkte inn her - fila ligg i git.
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.model=gemini-3.8-flash

# Google Kalender. credentials.json og tokens/ ligg i .gitignore.
google.calendar.credentials-path=credentials.json
google.calendar.tokens-dir=tokens
google.calendar.id=primary
google.calendar.timezone=Europe/Oslo

server.port=8080

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=update
